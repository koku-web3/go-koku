[grpc]
host = "127.0.0.1"
port = 50051

[tls]
enable = true
ca_cert_file = "certs/ca/ca.pem"
server_cert_file = "certs/server/coordinator.pem"
server_key_file = "certs/server/coordinator.key"

[signer]
address = "127.0.0.1:50052"

[signer.tls]
server_name = "signer"

[keycreator]
address = "127.0.0.1:50053"

[keycreator.tls]
server_name = "key-creator"

[txbuilder]
dial_timeout = 10

[txbuilder.keepalive]
time = 30
timeout = 10
permit_without_stream = true

[txbuilder.circuit_breaker]
failure_threshold = 5
recovery_window = 30

# 各链 TxBuilder 服务地址配置
[txbuilder.chains.btc]
address = "127.0.0.1:50101"

[txbuilder.chains.eth]
address = "127.0.0.1:50102"

[txbuilder.chains.tron]
address = "127.0.0.1:50103"

[mq]
url = "amqp://guest:guest@127.0.0.1:5672/"
exchange = "koku.universal.transfer"
exchange_type = "direct"
prefetch_count = 32
queue_acct0 = "universal.transfer.acct0"
queue_acct1 = "universal.transfer.acct1"
routing_key_acct0 = "acct0"
routing_key_acct1 = "acct1"
dial_timeout_sec = 10
heartbeat_sec = 30
reconnect_interval_sec = 5

[db]
host = "127.0.0.1"
port = 3306
user = "root"
password = "123456"
database = "kokudb"
max_open_conns = 1000
max_idle_conns = 1000

[log]
rotation = true
file_path = ""
max_size_mb = 100
max_backups = 10
max_age = 30
compress = true
format = "terminal"
verbosity = 3
vmodule = ""
