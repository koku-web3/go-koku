syntax = "proto3";

package txbuilder;

option go_package = "github.com/koku-web3/go-koku/pkg/proto/txbuilder;txbuilder";

// TxBuilder service provides transaction construction APIs
service TxBuilder {
  // 校验地址是否合法
  rpc VerifyAddress(VerifyAddressRequest) returns (VerifyAddressResponse);

  // 校验合约地址是否合法
  rpc VerifyContractAddress(VerifyContractAddressRequest) returns (VerifyContractAddressResponse);

  // 将 PKIX 标准的 PEM 格式公钥转换为指定区块链的地址
  rpc ConvertAddress(ConvertAddressRequest) returns (ConvertAddressResponse);

  // 检查地址是否有足够的余额转账
  // 支持检查合约余额
  rpc CheckSufficientBalance(CheckSufficientBalanceRequest) returns (CheckSufficientBalanceResponse);

  // 构造未签名交易数据
  rpc BuildSignRawData(BuildSignRawDataRequest) returns (BuildSignRawDataResponse);

  // 广播交易
  rpc TxBroadcast(TxBroadcastRequest) returns (TxBroadcastResponse);
}

// Common request with trace ID
message RequestWithTraceId {
  string trace_id = 1;
}

// VerifyAddress
message VerifyAddressRequest {
  string trace_id = 1;
  string address = 2;
}

message VerifyAddressResponse {
  bool is_valid = 1;
}

// VerifyContractAddress
message VerifyContractAddressRequest {
  string trace_id = 1;
  string address = 2;
}

message VerifyContractAddressResponse {
  bool is_valid = 1;
}

// ConvertAddress
message ConvertAddressRequest {
  string trace_id = 1;
  repeated PublicKeysRequest keys = 2;
}

message ConvertAddressResponse {
  repeated PublicKeysResponse address_list = 1;
}

// CheckSufficientBalance
message CheckSufficientBalanceRequest {
  string trace_id = 1; // 1-36 必填
  string chain_code = 2; // 1-36 必填； 唯一， 表示区块链名称，如：bitcoin、ethereum、tron
  string coin = 3; // 必填； 唯一， 表示转账币种，如：btc、eth、usdt、dog；不涉及判断逻辑，仅作展示
  bool is_basic_coin = 4; // 必填；是否主链币
  string from_address = 5; // 1-256 必填；转账发起地址
  string amount = 6; // 必填； 金额，单位是最小该链单位，如：以太坊单位就是wei；波场单位就是sun
  string contract = 7; // 1-256 非必填；转账币种对应的合约地址。如果`isBasicCoin`为false时，必填
}

message CheckSufficientBalanceResponse {
  bool is_coin_sufficient = 1; // 主链币是否足够
  bool is_token_sufficient = 2; // 合约余额是否足够；注意当检查合约余额时两个返回值都需要判断
}

// BuildSignRawData
message BuildSignRawDataRequest {
  string trace_id = 1; // 1-36 必填
  string chain_code = 2; // 1-36 必填； 唯一， 表示区块链名称，如：bitcoin、ethereum、tron
  string coin = 3; // 必填； 唯一， 表示转账币种，如：btc、eth、usdt、dog；不涉及判断逻辑，仅作展示
  bool is_basic_coin = 4; // 必填；是否主链币
  string coin_symbol = 5; // 1-36 必填； 币种符合，用于展示，不涉及逻辑
  string from_address = 6; // 1-256 必填；转账发起地址
  string to_address = 7; // 1-256 必填；转账接收地址
  string amount = 8; // 必填； 转账金额，单位是最小该链单位，如：以太坊单位就是wei；波场单位就是sun
  string contract = 9; // 1-256 非必填；转账币种对应的合约地址。如果`isBasicCoin`为false时，必填
}

message BuildSignRawDataResponse {
  string msg = 1; // SHA256(raw_data) - 待签名内容
  string raw_data = 2; // 原始交易数据 (hex 编码) - Coordinator 用于构造完整交易
}

// TxBroadcast
message TxBroadcastRequest {
  string trace_id = 1; // 1-36 必填
  string raw_data = 2; // 原始交易数据 (hex 编码)
  string signature = 3; // 签名 (hex 编码)
}

message TxBroadcastResponse {
  bool success = 1;
}

message PublicKeysRequest {
  uint32 account_index = 1;
  string pkix_pubkey_pem = 2;
}

message PublicKeysResponse {
  uint32 account_index = 1;
  string address = 2;
}