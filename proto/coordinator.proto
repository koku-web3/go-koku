syntax = "proto3";

package coordinator;

option go_package = "github.com/koku-web3/go-koku/internal/coordinator/grpc;grpc";

// ChainService gRPC 密钥管理服务
// 作为转发层，将请求转发给 Signer 服务
// 私钥明文仅存在于 Signer 服务内存中
service ChainService {
  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // 创建主密钥
  // 转发给 Signer 服务创建 HD 主密钥
  rpc CreateMasterKey(CreateMasterKeyRequest) returns (CreateMasterKeyResponse);

  // 创建派生密钥（运营/用户密钥）
  rpc CreateDerivedKey(CreateDerivedKeyRequest) returns (CreateDerivedKeyResponse);

  // 签名消息
  // 转发给 Signer 服务执行签名
  rpc Sign(SignRequest) returns (SignResponse);
}

// ============ 健康检查 ============

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
}

// ============ 创建主密钥 ============

message CreateMasterKeyRequest {
  string trace_id = 1;    // 链路跟踪 ID
  string chain = 2;       // 区块链网络名称（如 ethereum）
  string key_type = 3;    // 密钥类型（如 ecdsa-secp256k1）
}

message CreateMasterKeyResponse {
  string trace_id = 1;
  string key_name = 2;      // 主密钥名称，格式：{chain}-master-key
  string seed_ciphertext = 3; // Vault 加密的种子密文
  string public_key = 4;    // 公钥
  string bip44_path = 5;    // BIP-44 路径
}

// ============ 创建派生密钥 ============

message CreateDerivedKeyRequest {
  string trace_id = 1;
  string chain = 2;                       // 区块链网络名称
  string master_key_name = 3;             // 主密钥名称
  string master_key_pem_ciphertext = 10;  // 主密钥PEM密文（来自CreateMasterKey返回值）
  KeyUsage key_usage = 4;                 // 密钥用途
  string key_type = 5;                    // 密钥类型
  uint32 address_index = 6;               // 地址索引
}

enum KeyUsage {
  KEY_USAGE_UNSPECIFIED = 0;
  KEY_USAGE_OPERATIONAL = 1; // 运营用途
  KEY_USAGE_USER = 2;        // 用户用途
}

message CreateDerivedKeyResponse {
  string trace_id = 1;
  string key_name = 2;              // 派生密钥名称，格式：{chain}-child-{op|user}-{index}
  string priv_key_ciphertext = 3;   // Vault 加密的私钥密文
  string public_key = 4;            // 公钥
  string bip44_path = 5;            // BIP-44 路径
  string key_context = 6;           // Vault context
}

// ============ 签名消息 ============

message SignRequest {
  string trace_id = 1;
  string chain = 2;                // 区块链网络名称
  string key_name = 3;             // 派生密钥名称
  KeyUsage key_usage = 4;          // 密钥用途
  string key_type = 5;             // 密钥类型
  string key_context = 6;          // Vault context
  string message = 7;              // 待签名数据
  string priv_key_ciphertext = 8;   // 私钥密文
}

message SignResponse {
  string trace_id = 1;
  string signature = 2; // 签名结果（hex 格式）
}
