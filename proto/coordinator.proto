syntax = "proto3";

package coordinator;

option go_package = "github.com/koku-web3/go-koku/internal/coordinator/grpc;grpc";

// ChainService gRPC 密钥管理服务
// 提供密钥创建、查询、签名和验证等操作
service ChainService {
  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // 创建主密钥
  rpc CreateMasterKey(CreateMasterKeyRequest) returns (CreateMasterKeyResponse);

  // 获取密钥列表
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);

  // 获取密钥详情
  rpc ReadKey(ReadKeyRequest) returns (ReadKeyResponse);

  // 签名消息
  rpc Sign(SignRequest) returns (SignResponse);

  // 验证签名
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

// ============ 健康检查 ============

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
}

// ============ 创建主密钥 ============

message CreateMasterKeyRequest {
  string chain = 1;    // 区块链网络名称（如 ethereum）
  string name = 2;     // 密钥名称，不可重复
  string type = 3;      // 密钥类型（如 ecdsa-p256、ed25519）
  bool derived = 4;     // 是否启用派生密钥，默认 false
}

message CreateMasterKeyResponse {
  string message = 1;  // 操作结果描述
  string chain = 2;    // 区块链网络名称
  string name = 3;      // 密钥名称
  string type = 4;      // 密钥类型
  bool derived = 5;     // 是否启用派生密钥
  string public_key = 6; // 公钥（PEM 格式）
}

// ============ 获取密钥列表 ============

message ListKeysRequest {
  string chain = 1;    // 区块链网络名称
}

message ListKeysResponse {
  repeated string keys = 1;  // 密钥名称列表
}

// ============ 获取密钥详情 ============

message ReadKeyRequest {
  string chain = 1;    // 区块链网络名称
  string key_name = 2; // 密钥名称
}

message ReadKeyResponse {
  string request_id = 1;
  int64 version = 2;
  string name = 3;
  string creation_time = 4;
  map<string, string> keys = 5;
  int64 min_version = 6;
  int64 latest_version = 7;
}

// ============ 签名消息 ============

message SignRequest {
  string chain = 1;      // 区块链网络名称（如 eth）
  string key_name = 2;   // 密钥名称
  string data = 3;        // 要签名的数据（hex 编码，支持 0x 前缀）
}

message SignResponse {
  string chain = 1;           // 区块链网络名称
  string key_name = 2;       // 密钥名称
  string signature = 3;       // 签名结果（Vault 格式）
  string signature_hex = 4;  // 签名结果（纯十六进制格式）
}

// ============ 验证签名 ============

message VerifyRequest {
  string chain = 1;      // 区块链网络名称（如 eth）
  string key_name = 2;  // 密钥名称
  string data = 3;       // 原始数据（hex 编码）
  string signature = 4;  // 要验证的签名
}

message VerifyResponse {
  string chain = 1;     // 区块链网络名称
  string key_name = 2;  // 密钥名称
  bool valid = 3;       // 签名是否有效
}

// ============ 错误信息 ============

message ErrorResponse {
  string error = 1;       // 错误信息
  int32 code = 2;        // 错误码
}
